services:
  runner:
    build: .
    env_file: .env
    volumes:
      - werewolf-data:/data
    restart: unless-stopped

  web:
    image: caddy:2-alpine
    volumes:
      - werewolf-data:/data:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    restart: unless-stopped

  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    restart: unless-stopped

volumes:
  werewolf-data:
